<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Checkout</title>
  <link rel="stylesheet" href="/test.css" />
</head>
<body>
  <div style="display: flex; gap: 10px; padding: 20px;">
    <button id="payBtnPen" class="btn">Pagar en Soles (PEN)</button>
    <button id="payBtnUsd" class="btn">Pagar en Dólares (USD)</button>
  </div>

  <script src="/sdk.js"></script>
  <script>
    function openCheckout(currencyId) {
      MyCheckout.open({
        currencyId: currencyId, // 'PEN' o 'USD'
        price_unit: currencyId === 'USD' ? 50 : 199,
        quantity: 1,
        description: currencyId === 'USD' ? "Plan Enterprise USD" : "Plan Enterprise PEN",
        reference: "ORD-" + Math.floor(Math.random() * 10000),
        onSuccess: (data) => {
          console.log("Pago exitoso:", data);
        },
        onError: (error) => {
          console.error("Error en el pago:", error);
        },
        onClose: () => {
          console.log("El usuario cerró el modal");
        },
        theme: {
          primary: currencyId === 'USD' ? "#3b82f6" : "#2fbf59", // Azul para USD, verde para PEN
          primaryHover: currencyId === 'USD' ? "#2563eb" : "#22c55e",
          borderRadius: "30px", // Personalización del redondeo
        }
      });
    }

    document.getElementById("payBtnPen").addEventListener("click", () => openCheckout('PEN'));
    document.getElementById("payBtnUsd").addEventListener("click", () => openCheckout('USD'));
  </script>
</body>
</html>
